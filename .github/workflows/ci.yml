name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Signing certificates and notarization credentials live only in GitHub Actions
# secrets — never in the repository. Sparkle EdDSA private key is also a secret.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Run tests
        run: swift test

  build:
    name: Build universal app
    needs: test
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-${GITHUB_SHA::7}"
          fi
          echo "version=${version}" >>"$GITHUB_OUTPUT"
          echo "build_number=${GITHUB_RUN_NUMBER}" >>"$GITHUB_OUTPUT"
          echo "is_release=${{ startsWith(github.ref, 'refs/tags/v') }}" >>"$GITHUB_OUTPUT"

      - name: Import Developer ID certificate
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: Scripts/ci-import-certificate.sh

      - name: Build universal app
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          UNIVERSAL: "1"
          CONFIGURATION: release
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            test -n "${IDENTITY:-}" || { echo "missing Developer ID identity from import step" >&2; exit 1; }
          else
            export IDENTITY="-"
          fi
          echo "Building with IDENTITY=${IDENTITY}"
          Scripts/build-app.sh

      - name: Package zip + DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: Scripts/package-release.sh

      - name: Notarize DMG
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: Scripts/ci-notarize.sh "build/ClipboardX-${{ steps.version.outputs.version }}-macos-universal.dmg"

      - name: Generate Sparkle appcast
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          DMG_PATH: build/ClipboardX-${{ steps.version.outputs.version }}-macos-universal.dmg
          OUT_APPCAST: build/appcast.xml
          REPO: ${{ github.repository }}
        run: Scripts/ci-generate-appcast.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ClipboardX-${{ steps.version.outputs.version }}-macos-universal
          path: |
            build/ClipboardX-${{ steps.version.outputs.version }}-macos-universal.zip
            build/ClipboardX-${{ steps.version.outputs.version }}-macos-universal.dmg
            build/appcast.xml
          if-no-files-found: warn

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          dmg="$(find dist -name 'ClipboardX-*-macos-universal.dmg' | head -1)"
          zip="$(find dist -name 'ClipboardX-*-macos-universal.zip' | head -1)"
          appcast="$(find dist -name 'appcast.xml' | head -1)"
          test -n "$dmg"
          test -n "$zip"
          test -n "$appcast"

          if ! gh release view "$tag" >/dev/null 2>&1; then
            {
              echo "## ClipboardX ${version}"
              echo
              echo "Universal macOS app (Apple Silicon + Intel)."
              echo "Developer ID signed, notarized, and Sparkle-enabled for auto-updates."
              echo
              echo "### Install"
              echo "1. Download \`ClipboardX-${version}-macos-universal.dmg\`"
              echo "2. Open the DMG and drag \`ClipboardX\` into **Applications**"
              echo "3. Open the app and grant **Accessibility** when asked"
              echo
              echo "Later versions download automatically (menu bar → Check for Updates…)."
              echo
              echo "Source: \`${GITHUB_SHA}\`"
            } > /tmp/release-notes.md
            gh release create "$tag" \
              --title "ClipboardX ${version}" \
              --notes-file /tmp/release-notes.md \
              --verify-tag
          fi

          gh release upload "$tag" "$dmg" "$zip" "$appcast" --clobber
